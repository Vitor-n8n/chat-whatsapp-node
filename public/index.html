<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel WhatsApp Pro</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #e5ddd5; margin: 0; padding: 20px; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        .app-container { display: flex; width: 95%; max-width: 1100px; height: 85vh; background: #fff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); overflow: hidden; }

        /* Sidebar com Busca */
        .sidebar { width: 340px; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; background: #ffffff; }
        .sidebar-header { padding: 15px; background: #f0f2f5; font-weight: bold; border-bottom: 1px solid #e0e0e0; }
        .search-box { padding: 10px; border-bottom: 1px solid #eee; }
        .search-box input { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 20px; font-size: 13px; outline: none; }
        
        .contacts-list { flex: 1; overflow-y: auto; }
        .contact-item { padding: 12px 15px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
        .contact-item:hover { background: #f5f5f5; }
        .contact-item.active { background: #e6f7ff; border-left: 4px solid #1890ff; }
        .contact-info { flex: 1; overflow: hidden; }
        .contact-name { font-weight: bold; font-size: 14px; margin-bottom: 4px; color: #333; }
        .contact-last-msg { font-size: 12px; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Badge de mensagens não lidas */
        .badge { background: #25d366; color: white; border-radius: 50%; padding: 3px 8px; font-size: 11px; font-weight: bold; }

        /* Area Principal do Chat */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #efeae2; }
        .chat-header { padding: 15px; background: #f0f2f5; font-weight: bold; border-bottom: 1px solid #e0e0e0; height: 50px; display: flex; align-items: center; }
        .messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { padding: 8px 14px; border-radius: 8px; max-width: 70%; word-wrap: break-word; font-size: 14px; display: flex; flex-direction: column; gap: 5px; }
        .msg img { max-width: 100%; max-height: 250px; border-radius: 6px; }
        .recebida { background: #ffffff; align-self: flex-start; color: #333; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .enviada { background: #d9fdd3; color: #111b21; align-self: flex-end; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

        /* Box de Preview de Anexo */
        .file-preview-bar { display: none; padding: 8px 15px; background: #e4e6eb; font-size: 13px; color: #333; border-top: 1px solid #ccc; justify-content: space-between; align-items: center; }
        .btn-remove-file { color: red; font-weight: bold; cursor: pointer; margin-left: 10px; }

        /* Form de Envio com Anexo */
        .form-send { padding: 12px; background: #f0f2f5; display: flex; gap: 10px; align-items: center; border-top: 1px solid #e0e0e0; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
        .btn-attach { background: #666; color: white; padding: 9px 12px; border-radius: 6px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        .btn-attach:hover { background: #444; }
        button { padding: 10px 20px; background: #00a884; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #008f70; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #fileInput { display: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">Conversas</div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Pesquisar contato ou conversa..." onkeyup="filtrarContatos()" />
            </div>
            <div id="contactsList" class="contacts-list"></div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div id="chatHeader" class="chat-header">Selecione uma conversa ao lado</div>
            <div id="messages" class="messages"></div>

            <!-- Preview do arquivo antes de enviar -->
            <div id="filePreviewBar" class="file-preview-bar">
                <span id="fileNameDisplay"></span>
                <span class="btn-remove-file" onclick="removerAnexo()">✖ Cancelar anexo</span>
            </div>

            <div class="form-send">
                <input type="hidden" id="remoteJid" />
                
                <!-- Botão do Clipe de Anexo -->
                <label for="fileInput" class="btn-attach" title="Anexar Imagem ou Documento">📎</label>
                <input type="file" id="fileInput" onchange="previewFile()" disabled />
                
                <input type="text" id="texto" placeholder="Digite sua mensagem..." disabled />
                <button id="btnEnviar" onclick="enviar()" disabled>Enviar</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const contactsListDiv = document.getElementById('contactsList');
        const messagesDiv = document.getElementById('messages');
        const chatHeader = document.getElementById('chatHeader');
        const remoteJidInput = document.getElementById('remoteJid');
        const textoInput = document.getElementById('texto');
        const fileInput = document.getElementById('fileInput');
        const btnEnviar = document.getElementById('btnEnviar');
        const filePreviewBar = document.getElementById('filePreviewBar');
        const fileNameDisplay = document.getElementById('fileNameDisplay');

        let clienteAtualJid = null;
        let todosContatos = [];
        let arquivoAnexoBase64 = null;
        let arquivoAnexoTipo = null;
        let arquivoAnexoNome = null;

        socket.on('lista_contatos', (contatos) => {
            todosContatos = contatos;
            renderizarContatos(contatos);
        });

        function renderizarContatos(lista) {
            contactsListDiv.innerHTML = '';
            lista.forEach(contato => {
                const item = document.createElement('div');
                item.className = `contact-item ${contato.remote_jid === clienteAtualJid ? 'active' : ''}`;
                
                const nome = contato.push_name || contato.remote_jid.split('@')[0];
                const badgeHtml = contato.nao_lidas > 0 ? `<span class="badge">${contato.nao_lidas}</span>` : '';

                item.innerHTML = `
                    <div class="contact-info">
                        <div class="contact-name">${nome}</div>
                        <div class="contact-last-msg">${contato.ultima_mensagem || ''}</div>
                    </div>
                    ${badgeHtml}
                `;

                item.onclick = () => selecionarContato(contato.remote_jid, nome);
                contactsListDiv.appendChild(item);
            });
        }

        function filtrarContatos() {
            const termo = document.getElementById('searchInput').value.toLowerCase();
            const filtrados = todosContatos.filter(c => 
                (c.push_name && c.push_name.toLowerCase().includes(termo)) || 
                c.remote_jid.toLowerCase().includes(termo) ||
                (c.ultima_mensagem && c.ultima_mensagem.toLowerCase().includes(termo))
            );
            renderizarContatos(filtrados);
        }

        function selecionarContato(remoteJid, nome) {
            clienteAtualJid = remoteJid;
            remoteJidInput.value = remoteJid;
            chatHeader.innerText = `Conversando com: ${nome}`;
            
            textoInput.disabled = false;
            fileInput.disabled = false;
            btnEnviar.disabled = false;
            textoInput.focus();

            socket.emit('carregar_conversa', remoteJid);
        }

        socket.on('historico_conversa', (data) => {
            if (data.remoteJid === clienteAtualJid) {
                messagesDiv.innerHTML = '';
                data.mensagens.forEach(msg => {
                    const tipo = msg.from_me ? 'enviada' : 'recebida';
                    adicionarMensagemOnScreen(msg.texto, tipo, msg.media_url, msg.media_type);
                });
            }
        });

        socket.on('nova_mensagem', (msg) => {
            if (msg.remoteJid === clienteAtualJid) {
                adicionarMensagemOnScreen(msg.text, 'recebida', msg.mediaUrl, msg.mediaType);
            }
        });

        socket.on('mensagem_enviada', (msg) => {
            if (msg.remoteJid === clienteAtualJid) {
                adicionarMensagemOnScreen(msg.text, 'enviada', msg.mediaUrl, msg.mediaType);
            }
        });

        function adicionarMensagemOnScreen(texto, tipo, mediaUrl, mediaType) {
            const div = document.createElement('div');
            div.className = `msg ${tipo}`;

            if (mediaUrl) {
                if (mediaType === 'image') {
                    const img = document.createElement('img');
                    img.src = mediaUrl;
                    div.appendChild(img);
                } else if (mediaType === 'document') {
                    const link = document.createElement('a');
                    link.href = mediaUrl;
                    link.target = '_blank';
                    link.innerText = '📄 Baixar Documento';
                    div.appendChild(link);
                }
            }

            if (texto) {
                const p = document.createElement('span');
                p.innerText = texto;
                div.appendChild(p);
            }

            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Leitura do arquivo anexado e exibição do banner de preview
        function previewFile() {
            const file = fileInput.files[0];
            if (!file) return;

            arquivoAnexoNome = file.name;
            arquivoAnexoTipo = file.type.startsWith('image/') ? 'image' : 'document';

            const reader = new FileReader();
            reader.onload = function(e) {
                arquivoAnexoBase64 = e.target.result;
                fileNameDisplay.innerText = `📎 Anexo selecionado: ${file.name}`;
                filePreviewBar.style.display = 'flex';
            };
            reader.readAsDataURL(file);
        }

        function removerAnexo() {
            fileInput.value = '';
            arquivoAnexoBase64 = null;
            arquivoAnexoTipo = null;
            arquivoAnexoNome = null;
            filePreviewBar.style.display = 'none';
        }

        async function enviar() {
            const remoteJid = remoteJidInput.value;
            const text = textoInput.value;

            if (!remoteJid || (!text && !arquivoAnexoBase64)) return;

            btnEnviar.disabled = true;
            btnEnviar.innerText = 'Enviando...';

            try {
                const response = await fetch('/api/enviar-mensagem', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        remoteJid,
                        text,
                        mediaBase64: arquivoAnexoBase64,
                        mediaType: arquivoAnexoTipo,
                        fileName: arquivoAnexoNome
                    })
                });

                if (!response.ok) {
                    alert('Erro ao enviar anexo/mensagem. Verifique os logs no terminal!');
                }
            } catch (err) {
                console.error('Erro de envio:', err);
                alert('Erro de conexão ao enviar mensagem.');
            } finally {
                btnEnviar.disabled = false;
                btnEnviar.innerText = 'Enviar';
                textoInput.value = '';
                removerAnexo();
            }
        }
    </script>
</body>
</html>
